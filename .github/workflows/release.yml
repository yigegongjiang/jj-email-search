name: Release

# push tag 自动发布; workflow_dispatch 仅用于重跑: gh workflow run release.yml --ref vX.Y.Z
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  APP: build/Build/Products/Release/jj-email-search.app

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        run: |
          version="$(awk -F' *= *' '$1 == "MARKETING_VERSION" { print $2 }' version.xcconfig)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "$GITHUB_REF_NAME is not on master"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Universal (arm64 + x86_64), ad-hoc 签名: 无需 Apple 开发者账号。
      - name: Build
        run: |
          xcodebuild -project jj-email-search.xcodeproj -scheme jj-email-search \
            -configuration Release -derivedDataPath build -destination 'generic/platform=macOS' \
            ONLY_ACTIVE_ARCH=NO build

      - name: Verify
        run: |
          archs="$(lipo -archs "$APP/Contents/MacOS/jj-email-search")"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "unexpected archs: $archs"; exit 1; }
          codesign --verify --strict --deep "$APP"

      - name: Package
        run: |
          zip="jj-email-search-$VERSION-macos.zip"
          # ditto 保留可执行位 / 符号链接 / 签名所需的扩展属性。
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            awk -v header="## [$VERSION]" 'index($0, header) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md
            cat <<'NOTES'

          ### 安装

          未经 Apple 公证 (ad-hoc 签名)，解压后移至 `/Applications` 并移除隔离属性：

          ```bash
          xattr -dr com.apple.quarantine /Applications/jj-email-search.app
          ```
          NOTES
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
